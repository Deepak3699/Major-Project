# (removed obsolete `version` key: compose v2 warns on it every invocation)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leads_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  pg-migrator:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./packages/api/database:/db
    entrypoint: ["sh", "-c", "PGPASSWORD=postgres psql -h postgres -U postgres -c 'CREATE DATABASE n8n' 2>/dev/null || true; DATABASE_URL=postgresql://postgres:postgres@postgres:5432/leads_db sh /db/utils/apply_schema.sh"]

  redis:
    image: redis:7-alpine
    # Durability (Track 1): AOF everysec + named volume, so queued jobs, DLQs,
    # circuit-breaker state and daily-claim keys survive restarts (RPO <= 1s).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6381}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./packages/api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/leads_db
      REDIS_URL: redis://redis:6379
      HOST: 0.0.0.0
      WORKERS_URL: http://workers:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./packages/api/src/models/recommender:/app/src/models/recommender
      - ./packages/api/data:/app/data
    ports:
      - "${API_PORT:-3001}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./packages/web
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-5174}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  workers:
    build:
      context: ./packages/scrapers
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/leads_db
      REDIS_URL: redis://redis:6379
      REACHER_URL: http://reacher:3000
      ENABLE_DAILY_SCHEDULER: ${ENABLE_DAILY_SCHEDULER:-1}
      DAILY_SCRAPE_CATCHUP: ${DAILY_SCRAPE_CATCHUP:-1}
      DAILY_SCRAPE_HOUR: ${DAILY_SCRAPE_HOUR:-3}
      DAILY_SCRAPE_MINUTE: ${DAILY_SCRAPE_MINUTE:-0}
      SCRAPER_MAX_CONCURRENCY: ${SCRAPER_MAX_CONCURRENCY:-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${WORKERS_PORT:-8011}:8000"
    restart: unless-stopped
    volumes:
      - ./packages/scrapers:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  reacher:
    image: reacherhq/check-if-email-exists:latest
    ports:
      - "${REACHER_PORT:-5051}:3000"
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-admin123}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=postgres
      - VOLS_PATH=/tmp/n8n-data
      - N8N_PORT=5678
      - N8N_HOST=0.0.0.0
    ports:
      - "${N8N_PORT:-5679}:5678"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8n-data:/home/node/.n8n
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  n8n-data:
