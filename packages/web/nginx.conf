server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS with a short TTL: upstream container IPs change on
    # recreate, and nginx resolves names only once at startup by default (a
    # stale `api` IP 502s the whole app after any api redeploy). Variables
    # force re-resolution per request.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream api;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Entry HTML must never be cached: chunk filenames change per deploy and
    # a cached index.html pins the browser to the previous release's bundles
    # (stale UI after deploys with no errors anywhere).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Hashed build assets are content-addressed: cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api {
        proxy_pass http://$api_upstream:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Server-sent events (live lead updates). The API serves these under /api;
    # the client calls them relatively as /sse/*, so the prefix is re-attached
    # here. Buffering MUST stay off or the stream stalls.
    location /sse {
        proxy_pass http://$api_upstream:3000/api/sse;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    location /ws {
        proxy_pass http://$api_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
